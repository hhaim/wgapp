name: WGApp
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: YES
targets:
  WGApp:
    type: application
    platform: macOS
    sources:
      - path: Sources/WGApp
        excludes: [Info.plist]
      - path: Sources/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.wgapp
        PRODUCT_NAME: WGApp
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/WGApp/Info.plist
        ENABLE_APP_SANDBOX: NO
    dependencies:
      - target: WGProfileHelper
        embed: false
      - target: WGRootHelper
        embed: false
    postBuildScripts:
      - name: Embed signed helpers
        script: |
          set -euo pipefail
          helper_dir="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers"
          mkdir -p "$helper_dir"
          ditto "$BUILT_PRODUCTS_DIR/WGProfileHelper" "$helper_dir/WGProfileHelper"
          ditto "$BUILT_PRODUCTS_DIR/WGRootHelper" "$helper_dir/WGRootHelper"
  WGProfileHelper:
    type: tool
    platform: macOS
    sources:
      - path: Sources/WGProfileHelper
      - path: Sources/Shared/AppConstants.swift
    settings:
      base:
        PRODUCT_NAME: WGProfileHelper
        PRODUCT_BUNDLE_IDENTIFIER: com.example.wgapp.profile-helper
  WGRootHelper:
    type: tool
    platform: macOS
    sources:
      - path: Sources/WGRootHelper
      - path: Sources/Shared
    settings:
      base:
        PRODUCT_NAME: WGRootHelper
        PRODUCT_BUNDLE_IDENTIFIER: com.example.wgapp.root-helper
